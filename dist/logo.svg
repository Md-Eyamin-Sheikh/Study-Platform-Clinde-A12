<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="45" fill="url(#grad)" stroke="#047857" stroke-width="2"/>
  
  <!-- Book Icon -->
  <rect x="25" y="30" width="50" height="35" rx="3" fill="white" opacity="0.9"/>
  <rect x="28" y="33" width="44" height="29" rx="2" fill="none" stroke="#047857" stroke-width="1.5"/>
  
  <!-- Pages -->
  <line x1="35" y1="40" x2="65" y2="40" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <line x1="35" y1="45" x2="60" y2="45" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <line x1="35" y1="50" x2="65" y2="50" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <line x1="35" y1="55" x2="55" y2="55" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Graduation Cap -->
  <polygon points="40,20 60,20 65,25 35,25" fill="#047857"/>
  <rect x="49" y="20" width="2" height="8" fill="#047857"/>
  <circle cx="50" cy="28" r="1.5" fill="#047857"/>
  
  <!-- Study Hub Text (S & H) -->
  <text x="20" y="80" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">S</text>
  <text x="65" y="80" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">H</text>
</svg>
